<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quadro de Tarefas Acadêmicas — Gerenciador de Projetos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="cabecalho">
    <h1 class="cabecalho__titulo">Quadro de Tarefas Acadêmicas</h1>
  </header>

  <main class="conteudo">
    <div id="status" role="status" aria-live="polite"></div>
    <section class="painel" aria-labelledby="titulo-busca">
      <h2 id="titulo-busca">Busca e filtros</h2>

      <form class="filtros">
        <p class="filtros__busca">
          <label for="campo-busca">Buscar por título da tarefa</label>
          <input type="text" id="campo-busca" name="busca">
        </p>

        <fieldset class="grupo">
          <legend>Filtrar por status</legend>
          <p class="opcao">
            <input type="radio" id="status-todos" name="status" value="todos" checked>
            <label for="status-todos">Todos os status</label>
          </p>
          <p class="opcao">
            <input type="radio" id="status-a-fazer" name="status" value="a-fazer">
            <label for="status-a-fazer">A fazer</label>
          </p>
          <p class="opcao">
            <input type="radio" id="status-em-andamento" name="status" value="em-andamento">
            <label for="status-em-andamento">Em andamento</label>
          </p>
          <p class="opcao">
            <input type="radio" id="status-em-revisao" name="status" value="em-revisao">
            <label for="status-em-revisao">Em revisão</label>
          </p>
          <p class="opcao">
            <input type="radio" id="status-concluida" name="status" value="concluida">
            <label for="status-concluida">Concluída</label>
          </p>
        </fieldset>

        <fieldset class="grupo">
          <legend>Filtrar por prioridade</legend>
          <p class="opcao">
            <input type="radio" id="prioridade-todas" name="prioridade" value="todas" checked>
            <label for="prioridade-todas">Todas as prioridades</label>
          </p>
          <p class="opcao">
            <input type="radio" id="prioridade-baixa" name="prioridade" value="baixa">
            <label for="prioridade-baixa">Baixa</label>
          </p>
          <p class="opcao">
            <input type="radio" id="prioridade-media" name="prioridade" value="media">
            <label for="prioridade-media">Média</label>
          </p>
          <p class="opcao">
            <input type="radio" id="prioridade-alta" name="prioridade" value="alta">
            <label for="prioridade-alta">Alta</label>
          </p>
        </fieldset>

        <p class="filtros__acao">
          <button type="submit" class="botao">Aplicar busca e filtros</button>
        </p>
      </form>
    </section>

    <section class="quadro-secao" aria-labelledby="titulo-quadro">
      <h2 id="titulo-quadro">Quadro de tarefas</h2>

      <div class="quadro" data-quadro>
        <section class="coluna coluna--a-fazer" aria-labelledby="coluna-a-fazer">
          <h3 class="coluna__titulo" id="coluna-a-fazer">A fazer</h3>
          <ul class="coluna__lista" id="listaFazer" data-lista-status="a-fazer">
          </ul>
        </section>

        <section class="coluna coluna--em-andamento" aria-labelledby="coluna-em-andamento">
          <h3 class="coluna__titulo" id="coluna-em-andamento">Em andamento</h3>
          <ul class="coluna__lista" id="listaAndamento" data-lista-status="em-andamento">
          </ul>
        </section>

        <section class="coluna coluna--em-revisao" aria-labelledby="coluna-em-revisao">
          <h3 class="coluna__titulo" id="coluna-em-revisao">Em revisão</h3>
          <ul class="coluna__lista" id="listaRevisao" data-lista-status="em-revisao">
          </ul>
        </section>

        <section class="coluna coluna--concluida" aria-labelledby="coluna-concluida">
          <h3 class="coluna__titulo" id="coluna-concluida">Concluída</h3>
          <ul class="coluna__lista" id="listaConcluida" data-lista-status="concluida">
          </ul>
        </section>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <p>Daniel Bernardes — Desenvolvimento Frontend, 2026.2</p>
  </footer>
  <script src="js/app.js" type="module"></script>
</body>
</html>
